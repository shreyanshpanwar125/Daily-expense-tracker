
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Daily Expense Tracker</h1>
        <p>Manage your daily expenses easily</p>
    </header>

    <main class="container">

<!-- Multiple Expense Profiles -->
<section class="profile-section">

    <h2>Expense Profiles</h2>

    <label for="profileSelect">
        Select Profile
    </label>

    <select id="profileSelect">
        <option value="personal">Personal</option>
    </select>

    <div class="profile-buttons">
        <button type="button" id="addProfileBtn">
            + Add Profile
        </button>

        <button type="button" id="manageProfileBtn">
            Manage Profiles
        </button>
    </div>

</section>


        <section class="summary">

            <div class="card">
                <h3>Total Expenses</h3>
                <h2 id="totalExpense">₹0</h2>
            </div>

            <div class="card">
                <h3>Monthly Budget</h3>
                <h2 id="showBudget">₹0</h2>
            </div>

            <div class="card">
                <h3>Remaining Budget</h3>
                <h2 id="remainingBudget">₹0</h2>
            </div>

        </section>

        <section class="form-section">

            <h2>Add New Expense</h2>
<!-- Multiple Expense Profiles -->


            <form id="expenseForm">

                <label>Expense Title</label>
                <input type="text" id="title"
                    placeholder="Example: Lunch" required>

                <label>Amount (₹)</label>
                <input type="number" id="amount"
                    placeholder="Enter amount"
                    min="0.01" step="0.01" required>

                <label>Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <label>Date</label>
                <input type="date" id="date" required>

                <button type="submit" id="submitBtn">
                    Add Expense
                </button>

                <button type="button" id="cancelBtn"
                    class="cancel-btn" hidden>
                    Cancel Edit
                </button>

            </form>

        </section>

        <section class="budget-section">

            <h2>Set Monthly Budget</h2>

            <input type="number" id="budgetInput"
                placeholder="Enter monthly budget"
                min="0" step="0.01">

            <button type="button" id="budgetBtn">
                Save Budget
            </button>

        </section>

        <section class="history-section">

            <h2>Expense History</h2>

            <label>Filter by Category</label>

            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="expenseList">
                    </tbody>
                </table>
            </div>

        </section>

        <section class="report-section">
            <h2>Category Report</h2>
            <div id="categoryReport"></div>
        </section>

    </main>

    <footer>
        <p>Daily Expense Tracker | Mini Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
